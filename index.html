<style>
:root{--g:#1f7a4d;--gd:#17603c;--gl:#edf6f0;--bd:#e2e6e3;--tx:#17201a;--mu:#66736a;--bg:#fff;--wa:#b4531b}

.help{color:var(--mu);font-size:15px;margin:0 0 12px}
.sub{color:var(--mu);font-size:16px;margin:0 0 12px}
.q{margin:0 0 8px}
.opt{position:relative;display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--bd);border-radius:14px;padding:15px 16px;margin:10px 0;cursor:pointer;background:#fff;min-height:56px;transition:border-color .12s,background .12s;-webkit-tap-highlight-color:transparent}

.opt.dis{opacity:.4;cursor:not-allowed}
.opt:focus-within{outline:2px solid var(--g);outline-offset:2px}
.opt .ot{display:block;flex:1;min-width:0}
.opt .ot b{font-weight:600}
.opt .ot small{display:block;color:var(--mu);font-size:14px;margin-top:3px;line-height:1.45}
.sep{height:1px;background:var(--bd);margin:16px 0 6px}
.other,textarea,.fl input{width:100%;border:1.5px solid var(--bd);border-radius:12px;padding:13px 14px;font-size:17px;margin-top:6px;background:#fff;color:var(--tx)}
.other:focus,textarea:focus,.fl input:focus{outline:none;border-color:var(--g)}
textarea{min-height:130px;resize:vertical;line-height:1.5}
.note{background:#fff8e6;border-radius:12px;padding:12px 14px;font-size:15px;margin:12px 0}
.info{background:var(--gl);border-radius:12px;padding:12px 14px;font-size:15px;margin:0 0 18px;color:#24432f}
.err{color:var(--wa);font-size:14px;margin:8px 0}
.dt{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px;line-height:1.35;margin:14px 0 4px;border:1.5px solid var(--bd);border-radius:14px;overflow:hidden}
.dt th,.dt td{border-bottom:1px solid var(--bd);border-left:1px solid var(--bd);padding:9px 2px;text-align:center;vertical-align:middle;word-break:keep-all;overflow-wrap:anywhere}
.dt th:first-child,.dt td:first-child{width:36px;border-left:0;color:var(--mu);font-size:12px;font-weight:400}

.dt .sel{background:var(--gl)}
.dt .rr td{border-bottom:0;padding:0}
.rkc{display:flex;align-items:center;justify-content:center;height:58px;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}

.rkc .mk{display:block;width:32px;height:32px;border:2px solid #c3cbc5;border-radius:50%;background:#fff;color:#fff;font-size:16px;font-weight:700;line-height:28px}
.rkc.on .mk{background:var(--g);border-color:var(--g)}
.rkc:focus-within .mk{outline:2px solid var(--g);outline-offset:2px}
.at{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin-top:9px;font-size:16px;line-height:1.4}

.rw{background:var(--g);color:#fff;border-radius:12px;padding:11px 14px;margin:12px 0 4px;text-align:center}

.nl{list-style:none;margin:14px 0 22px;padding:0}

nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);padding:10px 20px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:6}

.btn{min-height:52px;border-radius:14px;border:0;background:var(--g);color:#fff;font-weight:700;font-size:17px;padding:0 18px;cursor:pointer;margin:4px 6px 4px 0}
.btn:disabled{background:#c5cdc7;cursor:not-allowed}
.btn.l{background:#f1f3f1;color:var(--tx);min-height:44px;font-size:15px}
.btn.full{display:block;width:100%;margin:14px 0 0}
.lnk{display:block;width:100%;background:none;border:0;color:var(--mu);font-size:15px;text-decoration:underline;padding:14px;margin-top:4px;cursor:pointer}
.done{text-align:center;padding:14px 0 6px}

<script>
/* ================= 설정 (배포 시 여기만 수정) ================= */
var CONFIG = {
  ENDPOINT: 'https://script.google.com/macros/s/AKfycbx-Z36xQpaC1ubbuN5MR2lcxoXMRxPkPxjD9rF6TVQOUBS78nPNcg5uIu4rkBJ7WDm3/exec',                 // Apps Script 웹앱 URL. 비워두면 데모 모드(응답이 이 기기에만 저장)
  ORG_LABEL: '팜러닝',          // 화면 표기용 기관명. ?blind=1 이면 감춤(블라인드 증빙 캡처용)
  SURVEY_TITLE: '청년농업인 선택교육 심층 인터뷰',
  SURVEY_VERSION: 'v2.3',
  COUPON_LABEL: '편의점 상품권 1만 5천 원',
  COUPON_SEND_NOTE: '남겨 주신 휴대전화번호로 편의점 모바일 상품권을 보내드립니다.',
  PRIVACY_RETENTION: '상품권 발송 후 바로 폐기',
  PRIVACY_VERSION: 'p2',        // 동의 문구를 바꾸면 올릴 것. 동의 기록에 함께 저장됨
  CONTACT: 'hanmu1@farmlearning.co.kr'                   // 문의처(전화·이메일). 비워두면 표시하지 않음
};

/* ================= 기본 유틸 ================= */
var Q_ = new URLSearchParams(location.search);
// 주소는 하나다. 선정 연차는 첫 화면에서 고른다(예전 QR의 ?day= 값은 무시한다).
function yearNo(){ var m=/^Y([123])$/.exec((S&&S.A&&S.A.YEAR)||''); return m?Number(m[1]):0; }
var BLIND = Q_.get('blind') === '1';
var DEMO = !CONFIG.ENDPOINT;
var NS = 'fl3:';
var K = { draft:NS+'draft', done:NS+'done', queue:NS+'queue', demo:NS+'demo', ver:NS+'ver', coupon:NS+'coupon' };
if (DEMO && Q_.get('reset') === '1') { try { Object.keys(localStorage).filter(function(k){return k.indexOf(NS)===0;}).forEach(function(k){localStorage.removeItem(k);}); } catch(e){} }
var store = {
  get:function(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set:function(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  del:function(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function uuid(){ try{ return crypto.randomUUID(); }catch(e){ return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,10); } }
function hash(s){ var h=2166136261; for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function seeded(seed){ var a=seed>>>0; return function(){ a=(a+0x6D2B79F5)>>>0; var t=a; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
function shuffled(arr,seed){ var r=seeded(seed), a=arr.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function orgName(){ return (BLIND||!CONFIG.ORG_LABEL) ? '조사 수행기관' : CONFIG.ORG_LABEL; }

/* ================= 응답 상태 ================= */
var S = store.get(K.draft) || {};
if (!S.A) S = { A:{}, page:0, requestId:uuid(), version:null, startedAt:null };
function A(id){ return S.A[id]; }
function has(id,v){ var x=S.A[id]; return Array.isArray(x) ? x.indexOf(v)>=0 : x===v; }
function save(){ store.set(K.draft,S); }

/* ================= 선택지 코드표 ================= */
var ITEMS = {
  GRAIN:[['RICE','벼'],['BARLEY','맥류'],['BEAN','콩'],['POTATO','감자·고구마'],['GRAIN_ETC','기타 식량작물']],
  FRUITVEG:[['STRAWBERRY','딸기'],['TOMATO','토마토'],['CUCUMBER','오이·호박'],['MELON','수박·참외·멜론'],['PEPPER_FV','파프리카·풋고추'],['FV_ETC','기타 과채류']],
  FRUIT:[['APPLE','사과'],['PEAR','배'],['GRAPE','포도'],['PEACH','복숭아·자두'],['PERSIMMON','감·단감'],['CITRUS','감귤·만감'],['FRUIT_ETC','기타 과수']],
  SPICE:[['RED_PEPPER','고추'],['GARLIC','마늘'],['ONION','양파'],['GREEN_ONION','대파·쪽파'],['SPICE_ETC','기타 조미채소']],
  LIVESTOCK:[['BEEF','한우·육우'],['DAIRY','낙농'],['PIG','양돈'],['POULTRY','양계'],['LIVESTOCK_ETC','기타 축산']],
  FLOWER_SPECIAL:[['FLOWER','화훼'],['GINSENG','인삼'],['MUSHROOM','버섯'],['HERB','약용·특용작물'],['FS_ETC','기타 화훼·특용']],
  ETC:[['LEAFY','엽채류'],['ROOT','근채류'],['ETC_FREE','그 밖의 품목']]
};
function productLabel(){
  var g=A('PRODUCT_GROUP'), it=A('PRODUCT_ITEM');
  if(!g||g==='UNDECIDED'||!it||/_ETC$|^ETC_FREE$|^OTHER$/.test(it)) return null;
  var l=(ITEMS[g]||[]).filter(function(x){return x[0]===it;})[0];
  return l?l[1]:null;
}
function careWord(){ return A('PRODUCT_GROUP')==='LIVESTOCK' ? '사양' : (A('PRODUCT_GROUP')&&A('PRODUCT_GROUP')!=='UNDECIDED' ? '재배' : '재배·사양'); }
function CARDS(){
  var p=productLabel();
  return [
    {v:'A', t:'A. 내 주품목 관리', d:(p?p:'내 주품목')+'의 '+careWord()+' 관리 점검 항목을 살펴보고 관리 점검표 작성'},
    {v:'B', t:'B. 판매·유통 실행', d:'판매경로와 거래 준비 항목을 살펴보고 판매 실행안 작성'},
    {v:'C', t:'C. 농장경영 실행', d:'비용·수익 관리 항목을 살펴보고 경영 점검표 작성'},
    {v:'D', t:'D. 현장기술 운영', d:'농기계·시설 운영의 점검 항목을 살펴보고 현장 관리 계획 작성'}
  ];
}
function cardOpts(only){ return CARDS().filter(function(c){return !only||only.indexOf(c.v)>=0;}).map(function(c){ return {v:c.v,t:c.t,sub:c.d,card:true}; }); }

/* ================= 문항 정의 ================= */
function o(arr){ return arr.map(function(x){ return {v:x[0],t:x[1],ex:!!x[2],other:x[0]==='OTHER'}; }); }
function single(id,label,opts,x){ return Object.assign({id:id,type:'single',label:label,opts:opts},x||{}); }
function multi(id,label,opts,x){ return Object.assign({id:id,type:'multi',label:label,opts:opts},x||{}); }
function text(id,label,x){ return Object.assign({id:id,type:'text',label:label},x||{}); }

function expQs(pre,name){
  var P=pre+'_';
  return {
    main:[ multi(P+'EXP','‘'+name+'’과 관련하여 귀하의 경험에 해당하는 것을 모두 선택해 주십시오.',[
      {v:P+'SEEN_ONLY',t:'안내는 봤지만 신청하지 않은 적 있음'},
      {v:P+'APPLIED_NOSHOW',t:'신청했지만 참석·수료하지 못한 적 있음'},
      {v:P+'COMPLETED',t:'참석·수료한 적 있음'},
      {v:P+'NEVER_SEEN',t:'안내를 본 적 없음',ex:true},
      {v:P+'UNSURE',t:'기억나지 않음',ex:true}],{help:'해당하는 경험이 여러 가지인 경우 모두 선택해 주십시오.'}) ],
    follow:[
      multi(P+'HELPFUL','가장 기억에 남는 교육 한 가지를 기준으로, 도움이 되었던 점은 무엇입니까? (최대 2개 선택)',o([['APPLICABLE','실제 농장에 적용할 내용'],['PRODUCT_TECH','품목 관련 기술'],['SALES_MGMT','판매·경영 정보'],['ASK_INSTRUCTOR','강사에게 질문 가능'],['NETWORK','다른 농업인과 교류'],['CREDIT','시수 인정'],['NONE','특별히 없음',1],['OTHER','기타']]),{max:2,show:function(){return has(P+'EXP',P+'COMPLETED');}}),
      multi(P+'DISAPPOINTING','같은 교육에서 아쉬웠던 점은 무엇입니까? (최대 2개 선택)',o([['GENERIC','내용이 일반적임'],['PRODUCT_MISMATCH','내 품목과 맞지 않음'],['LACK_PRACTICE','실습·적용 부족'],['TIME_PACE','시간·진도 부적합'],['ACCESS_INCONVENIENT','접근·접속 불편'],['NONE','특별히 없음',1],['OTHER','기타']]),{max:2,show:function(){return has(P+'EXP',P+'COMPLETED');}}),
      single(P+'BARRIER','신청하지 않았거나 참석·수료하지 못한 경우 중 가장 기억에 남는 사례를 기준으로, 가장 큰 이유는 무엇이었습니까?',o([['CONTENT_MISMATCH','내용이 맞지 않음'],['SCHEDULE','일정이 맞지 않음'],['DISTANCE_ACCESS','거리·접속 문제'],['LATE_NOTICE','공지를 늦게 앎'],['LOW_EXPECTED_EFFECT','효과가 기대되지 않음'],['PERSONAL','개인 사정'],['OTHER','기타']]),{show:function(){return has(P+'EXP',P+'SEEN_ONLY')||has(P+'EXP',P+'APPLIED_NOSHOW');}})
    ]
  };
}
var APQ=expQs('AP','농정원 선택교육'), LQ=expQs('LOCAL','농업기술센터 등 지역 선택교육');
function expVisible(pre){ return has(pre+'_EXP',pre+'_COMPLETED')||has(pre+'_EXP',pre+'_SEEN_ONLY')||has(pre+'_EXP',pre+'_APPLIED_NOSHOW'); }

/* ================= 선택실험(DCE) =================
   속성 4개: 내용(2) × 방식·이동(4: 온라인, 대면 편도 20·40·60분) × 진행 방식(3: 강의·실습·선도농가 사례) × 교육 시간(3: 2·3·4시간).
   한 화면에 비교표(과정 4개 + '신청 안 함'), 1인당 6회.
   다섯 칸을 선호 순서대로 누른다(첫 번째가 최우선 선택). 답은 누른 순서의 배열, 예: ['B','D','NONE','A','C'].
   실습·선도농가 사례는 온라인으로 할 수 없어, 온라인 카드는 항상 강의 중심이다(세트마다 온라인 1장, 대면 3장에 진행 방식 3종이 하나씩).
   조합표는 24세트를 4묶음(표시 버전 1~4)으로 나눈 것. 코드 네 자리 = 내용·방식·진행·시간 순서의 수준 번호. */

app.addEventListener('change',function(e){
  var t=e.target; if(t.dataset.q==null) return;
  var q=findQ(t.dataset.q), v=t.dataset.v, opts=qOpts(q);
  var op=opts.filter(function(x){return x.v===v;})[0];
  if(q.type==='single'){ S.A[q.id]=v; }
  else if(q.type==='rank'){
    // 누른 순서대로 쌓는다. 이미 누른 것을 다시 누르면 그것과 그 뒤 순위를 취소한다.
    var rk=(S.A[q.id]||[]).slice(), ri=rk.indexOf(v);
    if(ri>=0){ rk=rk.slice(0,ri); }
    else {
      rk.push(v);
      // 넷을 정하면 남은 하나는 자동으로 마지막 순위
      if(rk.length===opts.length-1) opts.forEach(function(x){ if(rk.indexOf(x.v)<0) rk.push(x.v); });
    }
    S.A[q.id]=rk;
  }
  else {
    var cur=(S.A[q.id]||[]).slice(), i=cur.indexOf(v);
    if(i>=0){ cur.splice(i,1); }
    else {
      if(op.ex){ cur=[v]; }
      else {
        cur=cur.filter(function(x){ var o2=opts.filter(function(y){return y.v===x;})[0]; return !(o2&&o2.ex); });
        if(q.max && cur.length>=q.max) { render(true); return; }
        cur.push(v);
      }
    }
    S.A[q.id]=cur;
  }
  if(q.id==='PRODUCT_GROUP'){ delete S.A.PRODUCT_ITEM; delete S.A.PRODUCT_ITEM_OTHER; }
  if(q.id==='GENERAL_TOPIC'){ for(var dn=1;dn<=DCE_N;dn++) delete S.A['DCE_'+dn]; delete S.A.DCE_REASON; delete S.A.DCE_REASON_OTHER; }
  if(q.id==='COURSES_ALL' && S.A.COURSE_FIRST && (S.A.COURSES_ALL||[]).indexOf(S.A.COURSE_FIRST)<0){ delete S.A.COURSE_FIRST; }
  save(); render(true);
  var isOther = !!(op&&op.other) && (q.type==='single' || (S.A[q.id]||[]).indexOf(v)>=0);
  if(isOther){ var oi=app.querySelector('.other'); if(oi){ try{ oi.focus(); }catch(err){} } }

  clearTimeout(autoT);
  var p=curPage();

    var sid=p.id;
    autoT=setTimeout(function(){ if(!S.done && !pending && curPage().id===sid && valid(curPage())) go(1); },260);
  }
});

function assignVersion(cb){
  if(S.version){ cb(); return; }
  if(DEMO){
    var c=store.get(K.ver)||{1:0,2:0,3:0,4:0}, m=Math.min(c[1],c[2],c[3],c[4]);
    var cand=[1,2,3,4].filter(function(k){return c[k]===m;});
    S.version=cand[Math.floor(Math.random()*cand.length)]; c[S.version]++; store.set(K.ver,c); save(); cb(); return;
  }
  var done=false;
  function fb(){ if(done) return; done=true; S.version=1+Math.floor(Math.random()*4); S.versionLocal=true; save(); cb(); }
  var to=setTimeout(fb,4000);
  fetch(CONFIG.ENDPOINT+'?action=assign&day='+yearNo()).then(function(r){return r.json();}).then(function(j){
    if(done) return; done=true; clearTimeout(to); S.version=(j&&j.version)||(1+Math.floor(Math.random()*4)); save(); cb();
  }).catch(function(){ clearTimeout(to); fb(); });
}
function post(body){

/* ================= 제출 ================= */
function flatten(){
  var out={};
  PAGES.forEach(function(p){
    var pv=pageVisible(p);
    p.qs.forEach(function(q){
      var vis=pv&&qVisible(q), opts = vis ? (qOpts(q)||[]) : (q.dyn ? [] : (q.opts||[]));
      var hasOther = q.dyn ? (q.id==='PRODUCT_ITEM') : (q.opts||[]).some(function(x){return x.other;});
      if(q.type==='text'){ out[q.id]= vis ? ((A(q.id)||'').trim()||'SKIP') : 'NA_BRANCH'; return; }
      if(q.type==='rank'){ out[q.id]= vis ? (A(q.id)||[]).join('>') : 'NA_BRANCH'; return; }
      if(q.type==='single'){
        out[q.id]= vis ? A(q.id) : 'NA_BRANCH';
        if(hasOther) out[q.id+'_OTHER']= (vis&&A(q.id)==='OTHER') ? ((A(q.id+'_OTHER')||'').trim()||'SKIP') : 'NA_BRANCH';
      } else {
        var cur=A(q.id)||[];
        opts.forEach(function(x){ out[q.id+'__'+x.v]= vis ? (cur.indexOf(x.v)>=0?1:0) : 'NA_BRANCH'; });
        if(opts.some(function(x){return x.other;})) out[q.id+'_OTHER']= (vis&&cur.indexOf('OTHER')>=0) ? ((A(q.id+'_OTHER')||'').trim()||'SKIP') : 'NA_BRANCH';
      }
    });
  });
  return out;
}
/* 관리자가 시트에서 바로 읽을 수 있는 형태: [문항ID, 질문, 고른 답(한글)] 목록. 분기로 안 보인 문항은 빈칸. */
function buildView(){
  var out=[];
  PAGES.forEach(function(p){
    if(p.notice||p.submit) return;
    var pv=pageVisible(p);
    p.qs.forEach(function(q){
      var vis=pv&&qVisible(q), txt='';
      if(vis){
        if(q.type==='text'){ txt=(A(q.id)||'').trim(); }
        else {
          var opts=qOpts(q)||[], cur=A(q.id); cur=Array.isArray(cur)?cur:(cur?[cur]:[]);
          txt=cur.map(function(v){
            var op=opts.filter(function(x){return x.v===v;})[0], t=op?(op.vt||op.t):v;
            if(op&&op.other){ var ot=(A(q.id+'_OTHER')||'').trim(); if(ot) t+=': '+ot; }
            return t;
          }).join(q.type==='rank'?' → ':' / ');
        }
      }
      out.push([q.id, '['+p.title+'] '+q.label, txt]);
    });
  });
  return out;
}
function buildPayload(){
  var data=flatten();
  data.FORMAT_4H_ORDER = A('FORMAT_ORDER')||'NA_BRANCH';
  for(var n=1;n<=DCE_N;n++){
    var st=dceSet(n), rk=A('DCE_'+n)||[];
    data['DCE_'+n+'_SET']=st.idx+1;
    data['DCE_'+n+'_FIRST']=rk[0]||'';
    st.alts.forEach(function(code,k){ data['DCE_'+n+'_'+DCE_ALT[k]]=dceMachine(code); });
  }
  return { requestId:S.requestId, surveyVersion:CONFIG.SURVEY_VERSION, surveyDayGroup:yearNo(), consent:'agree', displayVersion:S.version,
           durationSec:Math.round((Date.now()-(S.startedAt||Date.now()))/1000), completionStatus:'COMPLETE', data:data, view:buildView() };
}
function submit(){
  nx.disabled=true; nx.textContent='제출 중…';
  var payload=buildPayload();
  if(DEMO){
    payload.submittedAt=new Date().toISOString();
    var list=store.get(K.demo)||[]; list.push(payload); store.set(K.demo,list);
    finish({ok:true,submittedAt:payload.submittedAt,couponToken:'demo'}); return;
  }
  send(payload);
}
/* 제출이 실패하면(접속이 몰리거나 연결이 끊길 때) 잠깐 쉬었다가 자동으로 두 번 더 보낸다. 그래도 안 되면 '전송 대기' 화면. */
function send(payload,tryNo){
  tryNo=tryNo||0;
  store.set(K.queue,payload);
  post(payload)
    .then(function(j){
      if(j&&j.ok){ store.del(K.queue); pending=null; finish(j); }
      else throw new Error((j&&j.error)||'server');
    })
    .catch(function(){
      if(tryNo<2){ setTimeout(function(){ send(payload,tryNo+1); }, 2000+3000*tryNo+Math.random()*1500); return; }
      pending=payload; render();
    });
}
function finish(res){
  S.done={at:res.submittedAt||new Date().toISOString(), token:res.couponToken||'', coupon:'pending'};
  store.set(K.done,S.done); store.del(K.draft); render();
}

  cn.addEventListener('input',upd);
  cph.addEventListener('input',function(){ cph.value=fmtPhone(cph.value); upd(); });
  ca.addEventListener('change',function(){ document.getElementById('cal').classList.toggle('on',ca.checked); upd(); });
  document.getElementById('cskip').onclick=function(){ setCoupon('skipped'); };
  cs.onclick=function(){
    if(!ok()) return;
    ce.hidden=true; cs.disabled=true; cs.textContent='신청 중…';
    var body={action:'coupon', token:S.done.token, name:cn.value.trim(), phone:fmtPhone(cph.value), consent:true, privacyVersion:CONFIG.PRIVACY_VERSION};
    if(DEMO){
      var l=store.get(K.coupon)||[]; l.push({name:body.name,phone:body.phone,privacyVersion:body.privacyVersion}); store.set(K.coupon,l);
      setCoupon('requested'); return;
    }
    post(body).then(function(j){
      if(j&&(j.ok||j.error==='used')){ setCoupon('requested'); return; } // used: 앞선 신청은 저장됐는데 응답만 못 받은 경우
      var m={duplicate_phone:'이미 신청된 휴대전화번호입니다.', bad_token:'신청 정보를 확인하지 못했습니다. 현장 담당자에게 알려 주세요.', bad_input:'이름과 휴대전화번호를 다시 확인해 주세요.'}[j&&j.error];
      fail(m||'신청하지 못했습니다. 잠시 후 다시 눌러 주세요.');
    }).catch(function(){ fail('연결이 원활하지 않습니다. 잠시 후 다시 눌러 주세요.'); });
  };
}
function renderDone(){
  showNav(false);
  document.getElementById('cnt').textContent=''; document.getElementById('pg').style.width='100%';
  var d=S.done, c=d.coupon||'pending';
  var h='<div class="done"><div class="ck">✓</div><h1>'+(S.alreadyBefore?'이미 제출하셨습니다':'제출이 완료되었습니다')+'</h1><p class="sub">응답해 주셔서 감사합니다.</p></div>';
  if(c==='pending'){ h+=couponFormHtml(); }
  else if(c==='requested'){ h+='<div class="info"><b>'+esc(CONFIG.COUPON_LABEL)+' 신청이 완료되었습니다.</b><br>'+esc(CONFIG.COUPON_SEND_NOTE)+'</div><p class="sub" style="text-align:center">이제 창을 닫으셔도 됩니다.</p>'; }
  else { h+='<p class="sub" style="text-align:center">상품권을 받지 않고 마치셨습니다. 이제 창을 닫으셔도 됩니다.</p><button class="lnk" id="cback" type="button">상품권 신청 화면으로 돌아가기</button>'; }
  if(DEMO){
    var list=store.get(K.demo)||[], cl=store.get(K.coupon)||[];
    h+='<div class="note"><b>데모 전용 영역</b> (실제 배포 시 표시되지 않음)<br>저장된 데모 응답 '+list.length+'건 · 상품권 신청 '+cl.length+'건<br>'
      +'<button class="btn l" id="dl" type="button">CSV 내려받기</button><button class="btn l" id="sh" type="button">마지막 응답 보기</button><pre id="pre" hidden></pre></div>';
  }
  app.innerHTML=h;
  if(c==='pending') bindCouponForm();
  var cb=document.getElementById('cback'); if(cb) cb.onclick=function(){ setCoupon('pending'); };
  if(DEMO){
    document.getElementById('dl').onclick=downloadCsv;
    document.getElementById('sh').onclick=function(){ var l=store.get(K.demo)||[]; var last=l[l.length-1]; var pre=document.getElementById('pre'); pre.hidden=false;
      pre.textContent = last ? last.view.filter(function(r){return r[2];}).map(function(r){return r[1]+'\n → '+r[2];}).join('\n\n') : '(없음)'; };
  }
  window.scrollTo(0,0);
}
function downloadCsv(){
  var list=store.get(K.demo)||[]; if(!list.length) return;
  var base=['requestId','surveyVersion','surveyDayGroup','consent','displayVersion','submittedAt','completionStatus','durationSec'];
  var cols=[]; list.forEach(function(r){ Object.keys(r.data).forEach(function(k){ if(cols.indexOf(k)<0) cols.push(k); }); });
  function cell(x){ x=x==null?'':String(x); if(/^[=+\-@]/.test(x)) x="'"+x; return '"'+x.replace(/"/g,'""')+'"'; }
  var rows=[base.concat(cols).map(cell).join(',')];
  list.forEach(function(r){ rows.push(base.map(function(k){return cell(r[k]);}).concat(cols.map(function(k){return cell(r.data[k]);})).join(',')); });
  var blob=new Blob(['﻿'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='survey_demo.csv'; document.body.appendChild(a); a.click(); setTimeout(function(){ document.body.removeChild(a); },500);
}

/* ================= 시작 ================= */
(function init(){
  var d=store.get(K.done);
  if(d){ S.done=d; S.alreadyBefore=true; }
  var q=store.get(K.queue);
  if(q && !d){ pending=q; }
  render();
})();
</script>
</body>
</html>
